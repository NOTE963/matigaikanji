<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まちがい漢字タイムアタック</title>
<style>
:root{--bg:#fff8ee;--fg:#2b2118;--card:#fff;--ac:#e8590c;--sub:#8a7a6a;--bd:#ecd9bf;--ok:#2f9e44;--ng:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--fg:#f4eadb;--card:#2a231b;--ac:#ff922b;--sub:#a89884;--bd:#463a2c}}
:root[data-theme="dark"]{--bg:#1c1712;--fg:#f4eadb;--card:#2a231b;--ac:#ff922b;--sub:#a89884;--bd:#463a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
.scr{display:none;width:100%;max-width:480px;padding:16px;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scr.on{display:flex}
#home,#mode,#res{justify-content:center}
h1{font-size:30px;margin:0;line-height:1.3}
h1 span{color:var(--ac)}
p.s{color:var(--sub);margin:0}
.btn{width:80%;max-width:320px;padding:18px;font-size:22px;font-weight:700;border:2px solid var(--ac);border-radius:16px;background:var(--card);color:var(--ac)}
.btn small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.btn.p{background:var(--ac);color:#fff}
.btn:active{transform:scale(.97)}
.m2{border-color:#7048e8;color:#7048e8}.m3{border-color:#c92a2a;color:#c92a2a}
.bar{display:flex;justify-content:space-between;width:100%;font-size:18px;font-weight:700}
#time{font-variant-numeric:tabular-nums;color:var(--ac)}
#grid{display:grid;width:min(100%,62vh);aspect-ratio:1;position:relative}
.c{background:var(--card);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600;overflow:hidden;line-height:1}
.c.ng{background:var(--ng);color:#fff}
.c.ok{background:var(--ok);color:#fff}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800;color:var(--ac);background:var(--bg);z-index:2}
#msg{min-height:28px;color:var(--sub);font-weight:700}
#big{font-size:52px;font-weight:800;color:var(--ac)}
input{font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);width:80%;max-width:320px;text-align:center;user-select:text}
.tabs{display:flex;gap:8px;width:100%}
.tab{flex:1;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:17px;font-weight:700}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
ol{list-style:none;padding:0;margin:0;width:100%}
li{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:18px}
li b{color:var(--ac);margin-right:10px}
</style></head><body>

<div id="home" class="scr on">
 <h1>まちがい<span>漢字</span><br>タイムアタック</h1>
 <p class="s">たくさんの字の中から<br>1つだけ違う字を探せ！</p>
 <input id="pname" maxlength="8" placeholder="なまえ（ランキング用）">
 <button class="btn p" id="bStart">スタート</button>
 <button class="btn" id="bRank">ランキング</button>
</div>

<div id="mode" class="scr">
 <h1>モード選択</h1>
 <button class="btn" data-m="0">単純<small>8×8 ・ 64文字</small></button>
 <button class="btn m2" data-m="1">難<small>16×16 ・ 256文字</small></button>
 <button class="btn m3" data-m="2">鬼<small>26×26 ・ 676文字</small></button>
 <button class="btn" id="bBack" style="border-color:var(--bd);color:var(--sub);padding:12px;font-size:16px">もどる</button>
</div>

<div id="game" class="scr">
 <div class="bar"><span id="mn"></span><span id="time">0.00</span></div>
 <div id="grid"></div>
 <div id="msg"></div>
</div>

<div id="res" class="scr">
 <div id="rm" class="s"></div><div id="big">0.00秒</div>
 <div id="rs" class="s"></div>
 <button class="btn" id="bAgain">もう一回</button>
 <button class="btn" id="bHome1" style="border-color:var(--bd);color:var(--sub)">ホームへ</button>
</div>

<div id="rank" class="scr">
 <h1>ランキング</h1>
 <div class="tabs" id="tabs"></div>
 <ol id="list"></ol>
 <button class="btn" id="bHome2">ホームへ</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBAjqK2MDDptqzhH_-J4TmPF8beXFgQJ9M",
  authDomain: "hiraikun2.firebaseapp.com",
  projectId: "hiraikun2",
  storageBucket: "hiraikun2.firebasestorage.app",
  messagingSenderId: "441487054471",
  appId: "1:441487054471:web:0cbab1e6723721deef0a22",
  measurementId: "G-HRLMZH4ZSP"
};
const db=getFirestore(initializeApp(firebaseConfig));
let uid;
try{uid=localStorage.getItem('kuid');if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('kuid',uid)}}catch(e){uid='u'+Math.random().toString(36).slice(2,12)}
function getName(){try{return localStorage.getItem('kname')||'ななし'}catch(e){return 'ななし'}}

const MODES=[
 {name:"単純",n:8,gap:4,pairs:[["牛","午"],["未","末"],["土","士"],["大","太"],["千","干"],["日","曰"],["右","石"],["木","本"],["玉","王"],["矢","失"]]},
 {name:"難",n:16,gap:2,pairs:[["牛","午"],["未","末"],["土","士"],["待","侍"],["持","特"],["己","已"],["天","夫"],["由","申"],["苦","若"],["休","体"],["貝","見"],["問","間"],["白","自"],["晴","情"],["刀","力"]]},
 {name:"鬼",n:26,gap:1,pairs:[["己","已"],["戊","戌"],["末","未"],["刀","刃"],["壁","璧"],["免","兎"],["微","徴"],["墓","幕"],["汚","汗"],["栗","粟"],["鳥","烏"],["象","衆"],["貝","員"],["拔","抜"],["荒","慌"],["冶","治"]]}
];
const PEN=2000;
const $=id=>document.getElementById(id);
let mode=0,t0=0,pen=0,timer=0,last=0,live=false;
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}
function fmt(ms){return(ms/1000).toFixed(2)}
function begin(m){
 mode=m;const M=MODES[m];
 show('game');clearInterval(timer);live=false;pen=0;
 $('mn').textContent=M.name+'モード';$('time').textContent='0.00';
 const pr=M.pairs[Math.random()*M.pairs.length|0];
 const p=Math.random()<.5?pr:[pr[1],pr[0]];
 $('msg').textContent='';
 const g=$('grid'),n=M.n;
 g.style.gridTemplateColumns=`repeat(${n},1fr)`;g.style.gap=M.gap+'px';
 g.innerHTML='<div id="cd">3</div>';
 const odd=Math.random()*n*n|0;
 const fs=g.clientWidth/n*0.82;
 for(let i=0;i<n*n;i++){
  const c=document.createElement('div');c.className='c';
  c.style.fontSize=fs+'px';
  c.textContent=i===odd?p[1]:p[0];
  c.onpointerdown=()=>tap(c,i===odd);
  g.appendChild(c);
 }
 let k=3;
 const cd=setInterval(()=>{
  k--;
  if(k>0){$('cd').textContent=k;return}
  clearInterval(cd);$('cd').remove();
  $('msg').textContent=`「${p[0]}」の中の「${p[1]}」を探せ`;
  live=true;t0=performance.now();
  timer=setInterval(()=>$('time').textContent=fmt(performance.now()-t0+pen),50);
 },700);
}
function tap(c,hit){
 if(!live)return;
 if(hit){
  c.classList.add('ok');live=false;clearInterval(timer);
  last=performance.now()-t0+pen;
  setTimeout(end,350);
 }else{
  pen+=PEN;c.classList.add('ng');
  $('msg').textContent='ちがう！ +2秒';
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
 }
}
async function end(){
 $('big').textContent=fmt(last)+'秒';
 $('rm').textContent=MODES[mode].name+'モード';
 $('rs').textContent='記録を送信中…';show('res');
 const nm=getName();
 try{
  const ref=doc(db,'rank_'+mode,uid),sn=await getDoc(ref),best=sn.exists()?sn.data().t:null;
  if(best===null||last<best){
   await setDoc(ref,{n:nm,t:last,u:Date.now()});
   $('rs').textContent=best===null?'ランキングに登録しました！':'自己ベスト更新！ランキングに反映しました';
  }else{
   if(sn.data().n!==nm)await setDoc(ref,{n:nm,t:best,u:Date.now()});
   $('rs').textContent='自己ベスト '+fmt(best)+'秒（今回は更新なし）';
  }
 }catch(e){console.error(e);$('rs').textContent='ランキングに接続できませんでした';}
}
async function rank(m){
 $('tabs').innerHTML='';
 MODES.forEach((M,i)=>{const t=document.createElement('button');t.className='tab'+(i===m?' on':'');t.textContent=M.name;t.onclick=()=>rank(i);$('tabs').appendChild(t)});
 const l=$('list');l.innerHTML='<p class="s">読み込み中…</p>';show('rank');
 try{
  const qs=await getDocs(query(collection(db,'rank_'+m),orderBy('t'),limit(20)));
  l.innerHTML=qs.empty?'<p class="s">まだ記録がありません</p>':'';
  let i=0;
  qs.forEach(d=>{const x=d.data();i++;const li=document.createElement('li');
   if(d.id===uid)li.style.borderColor='var(--ac)';
   const a=document.createElement('span');a.innerHTML=`<b>${i}</b>`;a.append(x.n);
   const b=document.createElement('span');b.textContent=fmt(x.t)+'秒';
   li.append(a,b);l.appendChild(li)});
 }catch(e){console.error(e);l.innerHTML='<p class="s">ランキングを読み込めませんでした</p>'}
}
$('pname').value=(getName()==='ななし'?'':getName());
$('bStart').onclick=()=>{try{localStorage.setItem('kname',$('pname').value.trim()||'ななし')}catch(e){}show('mode')};
$('bRank').onclick=()=>rank(0);
$('bBack').onclick=()=>show('home');
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>begin(+b.dataset.m));
$('bAgain').onclick=()=>begin(mode);
$('bHome1').onclick=$('bHome2').onclick=()=>show('home');
</script></body></html>
